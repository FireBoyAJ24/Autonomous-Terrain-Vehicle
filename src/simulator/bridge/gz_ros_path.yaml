# Set just topic name, applies to both
# For ros and gz types: https://githusensor_msgs/msg/Imub.com/gazebosim/ros_gz/blob/ros2/ros_gz_bridge/README.md#example-1a-gazebo-transport-talker-and-ros-2-listener
# To run the gazebo ros path: ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=$WORKPACE/Autonomous-Terrain-Vehicle/src/simulator/gz_ros_path.yaml
- topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"

# Set just topic name, applies to both
- topic_name: "contact"
  ros_type_name: "ros_gz_interfaces/msg/Contacts"
  gz_type_name: "gz.msgs.Contacts"

# Set just ROS topic name, applies to both
# - ros_topic_name: "depth_camera"
#   ros_type_name: "sensor_msgs/msg/Image"
#   gz_type_name: "ignition.msgs.Image"

# Set just ROS topic name, applies to both
- ros_topic_name: "magnetometer"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"


- ros_topic_name: "wheel_rot"
  ros_type_name: "std_msgs/msg/Float32"
  gz_type_name: "gz.msgs.Float"

- ros_topic_name: "steer_angle"
  ros_type_name: "std_msgs/msg/Float32"
  gz_type_name: "gz.msgs.Float"

# Set just ROS topic name, applies to both
- ros_topic_name: "beacon_signal"
  ros_type_name: "std_msgs/msg/Float32"
  gz_type_name: "gz.msgs.Float"